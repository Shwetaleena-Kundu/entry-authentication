<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Entry</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">
      Entry<span aria-hidden="true">*</span>
    </a>

    <p>
      Already registered?
      <a href="index.html">Sign in</a>
    </p>
  </header>

  <main class="auth-layout">
    <section class="brand-panel" aria-labelledby="brand-title">
      <div class="brand-content">
        <p class="eyebrow">Your personal space</p>
        <h1 id="brand-title">Make it yours.</h1>
      </div>

      <div class="brand-art" aria-hidden="true">
        <div class="circle circle-peach"></div>
        <div class="circle circle-coral"></div>
      </div>
    </section>

    <section class="form-panel" aria-labelledby="register-title">
      <div class="form-container">
        <p class="form-eyebrow">02 / Create account</p>

        <h2 id="register-title">A fresh start begins here.</h2>
        <p class="form-description">
          Create your account to access your personal dashboard.
        </p>

        <form id="register-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Choose a username"
              autocomplete="username"
              minlength="3"
              maxlength="30"
              pattern="[A-Za-z0-9_]{3,30}"
              title="Use 3–30 letters, numbers, or underscores."
              required
            >
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              maxlength="254"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-field">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="8"
                aria-describedby="password-help"
                required
              >

              <button
                type="button"
                class="password-toggle"
                aria-label="Show password"
                aria-controls="password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>

            <small id="password-help" class="input-help">
              Use at least 8 characters.
            </small>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm password</label>

            <div class="password-field">
              <input
                type="password"
                id="confirm-password"
                name="confirmPassword"
                placeholder="Enter your password again"
                autocomplete="new-password"
                minlength="8"
                required
              >

              <button
                type="button"
                class="password-toggle"
                aria-label="Show password"
                aria-controls="confirm-password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
          </div>

          <p id="form-message" class="form-message" role="status"></p>

          <button type="submit" class="submit-button">
            Create account
          </button>
        </form>

        <p class="form-footer">
          Already registered?
          <a href="index.html">Sign in</a>
        </p>
      </div>
    </section>
  </main>
<script src="js/common.js"></script>
<script src="js/register.js"></script>
</body>
</html>
